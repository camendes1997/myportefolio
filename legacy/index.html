<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyPortefolio 9.1</title><style>
:root{font-family:Inter,system-ui,Arial;background:#0b1322;color:#eaf0f9}*{box-sizing:border-box}body{margin:0}header{padding:20px max(18px,calc((100vw - 1400px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;background:#121e30}h1{margin:0;font-size:25px}small,.muted{color:#9cafc7}nav{display:flex;gap:7px;overflow-x:auto;padding:12px max(18px,calc((100vw - 1400px)/2));background:#142034;position:sticky;top:0;z-index:5}button,.button{border:1px solid #42536a;background:#24354d;color:white;border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit;white-space:nowrap}button:hover{background:#344c68}button.active,.primary{background:#0b9177;border-color:#0b9177}button.danger{border-color:#7c3b48;color:#ffb4be}main{max-width:1400px;margin:auto;padding:23px}h2{margin:0 0 15px}h3{margin:0 0 13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.card,.panel{background:#17253a;border:1px solid #2c405a;border-radius:14px;padding:19px}.card .value{font-size:25px;font-weight:750;margin-top:10px}.positive{color:#64e1b3}.negative{color:#ff8d99}.panel{margin-top:17px;overflow-x:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px}.grid .panel{margin:0}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #2c3f57;font-size:13px}th{color:#a8bdd7}input,select{background:#0e1a2b;color:white;border:1px solid #405570;border-radius:8px;padding:10px;font:inherit;width:100%}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}form label{display:grid;gap:5px;font-size:13px;color:#bdcce0}form button{align-self:end}.notice{border-left:3px solid #e3b35b;background:#302b24;padding:12px 16px;border-radius:8px;color:#f2d8a4;margin:15px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pill{font-size:12px;color:#c1d5ed;background:#253a52;border-radius:8px;padding:7px 10px}.chartbox{position:relative;min-height:270px}.chartbox svg{display:block;width:100%;height:260px;touch-action:pan-y}.tooltip{max-width:calc(100% - 12px);overflow-wrap:anywhere;position:absolute;pointer-events:none;background:#07101f;border:1px solid #5a7896;border-radius:8px;padding:8px 11px;font-size:12px;z-index:2;display:none;white-space:nowrap}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#bdcde0;margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.filters select{width:auto;min-width:130px}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.summaryline{display:flex;justify-content:space-between;gap:8px;margin:9px 0}.muted-note{font-size:12px;color:#a9bad0;margin-top:10px}footer{text-align:center;padding:25px;color:#91a5c0;font-size:12px}@media(max-width:600px){main{padding:13px}.grid{grid-template-columns:1fr}.card .value{font-size:21px}}
